<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .glow-orb-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .pulse-pill {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .float-card-1 {
      animation: cardFloat1 6s ease-in-out infinite alternate;
    }
    .float-card-2 {
      animation: cardFloat2 7s ease-in-out infinite alternate;
    }
    .orbit-dot {
      animation: orbitMove 8s linear infinite;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-50px, -30px) scale(1.2); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      100% { opacity: 0.8; }
    }
    @keyframes cardFloat1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes cardFloat2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Subtle and Behind Content) -->
  <g opacity="0.35" filter="url(#glow)">
    <circle cx="200" cy="120" r="140" fill="#06b6d4" class="glow-orb-1" />
    <circle cx="1000" cy="280" r="160" fill="#8b5cf6" class="glow-orb-2" />
    <circle cx="600" cy="380" r="120" fill="#3b82f6" class="glow-orb-1" />
  </g>

  <!-- Geometric Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Floating Background Decorative Elements -->
  <g opacity="0.3">
    <!-- Extension Browser Mockup Card Left -->
    <g class="float-card-1" transform="translate(60, 110)">
      <rect width="180" height="110" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="20" cy="20" r="4" fill="#ef4444" />
      <circle cx="34" cy="20" r="4" fill="#f59e0b" />
      <circle cx="48" cy="20" r="4" fill="#10b981" />
      <rect x="18" y="38" width="144" height="8" rx="4" fill="#334155" />
      <rect x="18" y="54" width="110" height="8" rx="4" fill="#1e293b" />
      <rect x="18" y="70" width="80" height="8" rx="4" fill="#38bdf8" fill-opacity="0.6" />
    </g>

    <!-- Extension Browser Mockup Card Right -->
    <g class="float-card-2" transform="translate(960, 200)">
      <rect width="180" height="110" rx="10" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="20" cy="20" r="4" fill="#ef4444" />
      <circle cx="34" cy="20" r="4" fill="#f59e0b" />
      <circle cx="48" cy="20" r="4" fill="#10b981" />
      <rect x="18" y="38" width="130" height="8" rx="4" fill="#334155" />
      <rect x="18" y="54" width="90" height="8" rx="4" fill="#a855f7" fill-opacity="0.6" />
      <rect x="18" y="70" width="120" height="8" rx="4" fill="#1e293b" />
    </g>
  </g>

  <!-- Dynamic Connecting Tech Circuit Line -->
  <path d="M 150 350 L 320 350 L 380 380 L 820 380 L 880 350 L 1050 350" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="6 6" class="pulse-pill" />

  <!-- Foreground Content (Solid, Clear, Prominent) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(600, 75)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
      <circle cx="-115" cy="0" r="6" fill="#10b981" />
      <text x="-95" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1.5">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Browser &amp; Desktop Extensions
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Top SaaS Platforms &amp; Open-Source Projects for Browser Productivity &amp; Workflows
    </text>

    <!-- Feature Pills in Center-Bottom -->
    <g transform="translate(600, 280)">
      <!-- Pill 1: Password Managers -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🔐 Password Vaults</text>
      </g>

      <!-- Pill 2: Web Clippers -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">📑 Web Clippers</text>
      </g>

      <!-- Pill 3: Privacy & AdBlock -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="82" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🛡️ Privacy &amp; Blocks</text>
      </g>

      <!-- Pill 4: Screen Recording -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="175" height="38" rx="19" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="87" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🎥 Async Video &amp; Notes</text>
      </g>
    </g>

    <!-- Bottom Accent Border -->
    <rect x="0" y="416" width="1200" height="4" fill="url(#titleGrad)" />
  </g>
</svg>